
<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <!-- VÍDEO DE FUNDO -->
    <div class="caixa-video">

        <video
            src="./img/video-fundo.mp4"

            loop

        </video>

        <div class="mascara-video"></div>

    </div>


    <!-- CABEÇALHO -->
    <div class="cabecalho">

        <img
            src="./img/temp.png"

        <a>Home</a>
        <a>Itens</a>

        >

    </div>

    <div class="caixa-principal">

        <div class="caixa-info-texto">

            <img
                src="./img/logo priston tale.png"
                alt="logo-priston-tale"
                class="logo-pt"

            Dê Sua Sugestão!
            </button>

        </div>


        <div>

            <img
                src="./img/personagens.png"
                alt="personagens"
                class="personagens"
            >

        </div>

    </div>


    <!-- BOTÃO WHATSAPP -->
    <div class="caixa-wpp">

        <a href="wa.me/73998376984" target="_blank" rel="noopener noreferrer"
            class="link-wpp"
        >

                src="./img/wpp.png"
                alt="Suporte"
            >

        </a>
